# Creates/updates the agent-program labels defined in .github/program-labels.json.
# Runs automatically when the definition file changes on main, or manually via
# workflow_dispatch. Additive only: it never deletes labels.
#
# Part of the agent-program tooling; see docs/process/AGENT-PROGRAM-PLAYBOOK.md.
name: Program Label Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/program-labels.json']

permissions:
  issues: write

jobs:
  sync:
    name: Sync program labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const labels = JSON.parse(fs.readFileSync('.github/program-labels.json', 'utf8'));
            const { owner, repo } = context.repo;
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
                core.info(`Updated label: ${label.name}`);
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
                core.info(`Created label: ${label.name}`);
              }
            }
