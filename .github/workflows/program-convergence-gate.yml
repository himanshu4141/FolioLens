# Mechanical merge gate for agent-program implementation PRs.
#
# Membership is derived from the head branch name: any PR whose head branch
# starts with `program/` is a program PR (a PR's head branch cannot change
# after creation, so membership cannot be toggled off the way a label can).
# The `program-milestone` label also opts a PR in, but it is the weaker,
# human-visible signal — program branches MUST use the `program/` prefix.
# Every other PR passes immediately, so the "Dual-review convergence" check is
# safe to mark "required" on main without affecting normal PRs.
#
# Source of truth: SHA-pinned convergence comments. The gate passes only when
# BOTH reviewers have posted a comment whose ENTIRE trimmed body is exactly
#   [<Role> review <ID>] CONVERGED at <full 40-char head SHA>
# matching the CURRENT head. Whole-body matching is deliberate: a substring
# match would accept negations ("NOT CONVERGED at <sha>", "Withdrawing
# CONVERGED at <sha>") or quoted mentions of the format in discussion. To
# withdraw a convergence at the same head, edit or delete that comment.
# The codex-converged/claude-converged labels are advisory UX: they are
# stripped on every push, and adding one is what re-triggers this gate — but
# they are never trusted as evidence, so a stale label surviving an unlabeled
# period cannot green the gate.
#
# Honesty note: with every role posting through one GitHub account, this gate
# guards against process mistakes, not adversarial agents — a rogue session
# could forge a reviewer's comment. SHA-pinning makes that auditable after the
# fact, not impossible.
#
# Part of the agent-program tooling; see docs/process/AGENT-PROGRAM-PLAYBOOK.md.
name: Program Convergence Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate:
    name: Dual-review convergence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const issue_number = pr.number;
            const headSha = pr.head.sha.toLowerCase();
            const labelNames = pr.labels.map((label) => label.name);

            const isProgramPr =
              pr.head.ref.startsWith('program/') || labelNames.includes('program-milestone');
            if (!isProgramPr) {
              core.info('Not a program PR (no program/ branch prefix, no program-milestone label); gate passes.');
              return;
            }

            // Convergence labels are advisory; strip them on new commits so the
            // PR's label state never claims a convergence that no longer holds.
            if (context.payload.action === 'synchronize') {
              for (const name of ['codex-converged', 'claude-converged']) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                  core.info(`Stripped stale convergence label: ${name}`);
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }

            // Evidence: SHA-pinned CONVERGED comments at the current head, in
            // issue comments or review bodies. Labels are deliberately not
            // consulted — they can go stale while the program label is absent.
            const bodies = [];
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            bodies.push(...comments.map((c) => c.body || ''));
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            });
            bodies.push(...reviews.map((r) => r.body || ''));

            // The ENTIRE trimmed comment must be exactly the convergence marker
            // with the full 40-char current head SHA. Substring matching would
            // accept negated or quoted forms ("NOT CONVERGED at <sha>",
            // "Withdrawing CONVERGED at <sha>").
            const convergedAtHead = (role) => {
              const pattern = new RegExp(
                `^\\[${role} review [^\\]\\n]{1,80}\\] CONVERGED at ${headSha}$`,
                'i'
              );
              return bodies.some((body) => pattern.test((body || '').trim()));
            };

            const missing = ['Codex', 'Claude'].filter((role) => !convergedAtHead(role));
            if (missing.length > 0) {
              core.setFailed(
                `Awaiting SHA-pinned convergence at head ${headSha} from: ${missing.join(', ')}. ` +
                  'Each reviewer must post a standalone comment whose entire body is exactly ' +
                  `"[<Role> review <ID>] CONVERGED at ${headSha}" (full 40-char SHA, nothing else — ` +
                  'no footers) and add their converged label (the label add re-triggers this gate).'
              );
            } else {
              core.info(`Both reviewers have converged at ${headSha}. Gate is green.`);
            }
