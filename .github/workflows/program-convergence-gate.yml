# Mechanical merge gate for agent-program implementation PRs.
#
# Membership is derived from the head branch name: any PR whose head branch
# starts with `program/` is a program PR (a PR's head branch cannot change
# after creation, so membership cannot be toggled off the way a label can).
# The `program-milestone` label also opts a PR in, but it is the weaker,
# human-visible signal — program branches MUST use the `program/` prefix.
# Every other PR passes immediately, so the "Dual-review convergence" check is
# safe to mark "required" on main without affecting normal PRs.
#
# Source of truth: SHA-pinned convergence comments. The gate passes only when
# BOTH reviewers have posted a comment whose ENTIRE trimmed body is exactly
#   [<Role> review <ID>] CONVERGED at <full 40-char head SHA>
# matching the CURRENT head. Whole-body matching is deliberate: a substring
# match would accept negations ("NOT CONVERGED at <sha>", "Withdrawing
# CONVERGED at <sha>") or quoted mentions of the format in discussion. A
# standardized trailing signature footer that some posting integrations append
# automatically (e.g. Claude Code's "---\n_Generated by [Claude Code](…)_") is
# stripped before matching, so the gate works with or without it; the strict
# whole-body match still applies to the remainder, preserving the guarantees
# above. To withdraw a convergence at the same head, edit or delete that
# comment — or, for posting integrations that cannot edit or delete, post a
# comment whose entire body is exactly
#   [<Role> review <ID>] WITHDRAW CONVERGED at <full 40-char head SHA>
# A CONVERGED marker counts only while it is newer than every WITHDRAW marker
# for the same role at the same head; re-converging after a withdrawal
# requires a NEW marker comment (timestamps are creation times, so editing an
# old comment cannot resurrect a withdrawn convergence).
# The codex-converged/claude-converged labels are advisory UX: they are
# stripped on every push, and adding one is what re-triggers this gate — but
# they are never trusted as evidence, so a stale label surviving an unlabeled
# period cannot green the gate.
#
# Honesty note: with every role posting through one GitHub account, this gate
# guards against process mistakes, not adversarial agents — a rogue session
# could forge a reviewer's comment. SHA-pinning makes that auditable after the
# fact, not impossible.
#
# Part of the agent-program tooling; see docs/process/AGENT-PROGRAM-PLAYBOOK.md.
name: Program Convergence Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate:
    name: Dual-review convergence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const issue_number = pr.number;
            const headSha = pr.head.sha.toLowerCase();
            const labelNames = pr.labels.map((label) => label.name);

            const isProgramPr =
              pr.head.ref.startsWith('program/') || labelNames.includes('program-milestone');
            if (!isProgramPr) {
              core.info('Not a program PR (no program/ branch prefix, no program-milestone label); gate passes.');
              return;
            }

            // Convergence labels are advisory; strip them on new commits so the
            // PR's label state never claims a convergence that no longer holds.
            if (context.payload.action === 'synchronize') {
              for (const name of ['codex-converged', 'claude-converged']) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                  core.info(`Stripped stale convergence label: ${name}`);
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }

            // Evidence: SHA-pinned marker comments at the current head, in
            // issue comments or review bodies, kept with their creation
            // timestamps so a later WITHDRAW marker can invalidate an earlier
            // CONVERGED marker. Labels are deliberately not consulted — they
            // can go stale while the program label is absent.
            const entries = [];
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            entries.push(...comments.map((c) => ({ body: c.body || '', at: c.created_at })));
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            });
            entries.push(...reviews.map((r) => ({ body: r.body || '', at: r.submitted_at })));

            // Some reviewers post through integrations that append a fixed
            // trailing signature footer (e.g. Claude Code adds
            // "\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_").
            // Strip such a footer before matching so the gate is resilient with
            // or without it. The strict whole-body match below is still applied
            // to the footer-stripped remainder, so this does NOT weaken the
            // anti-negation guarantee: "NOT CONVERGED at <sha>\n\n---\n_Generated…_"
            // still fails because the text before the footer is not the marker.
            const stripSignatureFooter = (body) =>
              (body || '')
                .trim()
                .replace(
                  /\n+\s*-{3,}\s*\n+\s*_Generated by \[Claude Code\]\([^)]*\)_\s*$/i,
                  ''
                )
                .trim();

            // The ENTIRE comment body (minus any stripped signature footer) must
            // be exactly the marker with the full 40-char current head SHA.
            // Whole-body matching is deliberate: a substring match would accept
            // negated or quoted forms ("NOT CONVERGED at <sha>", "Withdrawing
            // CONVERGED at <sha>").
            //
            // Withdrawal: a "[<Role> review <ID>] WITHDRAW CONVERGED at <sha>"
            // marker invalidates any CONVERGED marker for the same role/head
            // that is not newer than it. Ties go to the withdrawal. Timestamps
            // are creation times, so re-converging after a withdrawal requires
            // a NEW comment — editing an old one cannot resurrect convergence.
            const latestMatch = (pattern) => {
              let latest = -Infinity;
              for (const { body, at } of entries) {
                if (pattern.test(stripSignatureFooter(body))) {
                  const t = Date.parse(at || '');
                  latest = Math.max(latest, Number.isNaN(t) ? 0 : t);
                }
              }
              return latest;
            };
            const convergedAtHead = (role) => {
              const converged = latestMatch(
                new RegExp(`^\\[${role} review [^\\]\\n]{1,80}\\] CONVERGED at ${headSha}$`, 'i')
              );
              const withdrawn = latestMatch(
                new RegExp(`^\\[${role} review [^\\]\\n]{1,80}\\] WITHDRAW CONVERGED at ${headSha}$`, 'i')
              );
              return converged !== -Infinity && converged > withdrawn;
            };

            const missing = ['Codex', 'Claude'].filter((role) => !convergedAtHead(role));
            if (missing.length > 0) {
              core.setFailed(
                `Awaiting SHA-pinned convergence at head ${headSha} from: ${missing.join(', ')}. ` +
                  'Each reviewer must post a standalone comment whose entire body is exactly ' +
                  `"[<Role> review <ID>] CONVERGED at ${headSha}" (full 40-char SHA; an ` +
                  'auto-appended "Generated by [Claude Code]" signature footer is tolerated, but no ' +
                  'other trailing text) and add their converged label (the label add re-triggers this gate).'
              );
            } else {
              core.info(`Both reviewers have converged at ${headSha}. Gate is green.`);
            }
