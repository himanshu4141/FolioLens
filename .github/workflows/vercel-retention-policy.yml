name: Vercel Retention Policy Check

# Read-only inspector for a Vercel project's Deployment Retention Policy.
#
# Confirmed against the live API (2026-09-06): PATCH /v9/projects/{idOrName}
# rejects `deploymentExpiration` with "should NOT have additional property" —
# it's a read-only field on the Project resource. Vercel does not expose a
# way to WRITE the retention policy over the REST API; it must be set in the
# dashboard (Settings -> Security -> Deployment Retention Policy). See
# docs/INFRASTRUCTURE.md "Deployment retention" for the target values and why
# this matters (DEV auto-deploys on every PR/main-merge and each retained
# deployment carries its own Python function bundles, which is what drove
# Functions Storage to its Hobby-tier quota).
#
# Reuses the existing VERCEL_TOKEN / VERCEL_ORG_ID secrets (already used by
# production-release.yml) rather than introducing new credentials.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Vercel project id or name to inspect"
        required: false
        default: "prj_EQ1YcOJeh9nzDnjk4mdPRi4y7zOR" # foliolens-dev

jobs:
  check-retention:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      PROJECT: ${{ inputs.project }}
    steps:
      - name: Show current retention policy
        run: |
          curl -sS "https://api.vercel.com/v9/projects/${PROJECT}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin).get('deploymentExpiration'), indent=2))"
