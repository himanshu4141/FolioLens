name: Test Billing Charges API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - name: Query FOCUS billing charges for the last 14 days
        run: |
          FROM=$(date -u -d '14 days ago' +%Y-%m-%dT00:00:00Z)
          TO=$(date -u +%Y-%m-%dT00:00:00Z)
          echo "Range: $FROM to $TO"
          curl -sS -N "https://api.vercel.com/v1/billing/charges?teamId=${VERCEL_ORG_ID}&from=${FROM}&to=${TO}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -o /tmp/charges.jsonl -w "HTTP %{http_code}\n"
          echo "--- line count ---"
          wc -l /tmp/charges.jsonl || true
          echo "--- first 20 lines ---"
          head -c 4000 /tmp/charges.jsonl || true
          echo
          echo "--- unique ServiceName values ---"
          python3 -c "
          import json
          names = set()
          try:
              with open('/tmp/charges.jsonl') as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          d = json.loads(line)
                          names.add(d.get('ServiceName'))
                      except Exception as e:
                          print('parse error:', e, line[:200])
          except FileNotFoundError:
              print('no file')
          print(sorted(n for n in names if n))
          "
